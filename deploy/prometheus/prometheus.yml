global:
  scrape_interval: 15s

scrape_configs:
  - job_name: coach-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: linux-vm
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    static_configs:
      - targets: ["cadvisor:8080"]
